<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1421"><title>GPT 用量管家 V2</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1421;color:#edf3ff;font:16px -apple-system,BlinkMacSystemFont,sans-serif;padding:env(safe-area-inset-top) 18px 30px}main{max-width:700px;margin:auto}header{padding:25px 0 10px}h1{margin:0;font-size:27px}p,small{color:#a9b9ce;line-height:1.6}.card{background:#1b293d;border:1px solid #33465e;border-radius:18px;padding:18px;margin:14px 0}.muted{color:#9db1c9;font-size:13px}.big{font-size:22px;font-weight:700;margin:12px 0}.ok{color:#8ce0b3}.warn{color:#ffcf7b}a{color:#b1d2ff}button{border:0;background:#365b91;color:#fff;border-radius:10px;padding:11px 16px;font-weight:600}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.bar{height:9px;border-radius:6px;background:#394960;overflow:hidden;margin:13px 0}.fill{height:100%;background:#65b5f5}.links{display:flex;gap:14px;flex-wrap:wrap}.time{font-size:12px;color:#94a8c2}footer{font-size:12px;color:#90a2b7;margin-top:20px}</style></head><body><main><header><h1>◇ GPT 用量管家 <span class="muted">V2</span></h1><p>真实数据优先 · 无需手动记录</p></header><div class="row"><span id="overall" class="warn">未连接真实数据源</span><button id="refresh">刷新</button></div><div id="cards"></div><footer>只显示官方授权采集的数据。此页面不要求输入账户密码、Cookie 或 API Key。<p><a href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT</a> · <a href="https://platform.openai.com/usage" target="_blank" rel="noopener">API 官方用量</a></p><span id="checked"></span></footer></main><script>
const SOURCES=[{id:'codex',name:'Codex / Work'},{id:'api',name:'OpenAI API'},{id:'chatgpt',name:'ChatGPT'}];
const DATA_URL='./usage.json';
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function date(ts){if(!Number.isFinite(ts))return '未知';return new Date(ts*1000).toLocaleString('zh-CN')}
function card(source){const limits=Array.isArray(source.limits)?source.limits:[];const status=source.state==='ok'&&limits.length?'已同步':source.state==='stale'?'数据过期':source.state==='error'?'读取失败':'未连接';return '<section class="card"><div class="row"><strong>'+safe(source.name)+'</strong><small class="'+(status==='已同步'?'ok':'warn')+'">'+status+'</small></div>'+(status==='已同步'?limits.map(l=>{const used=Number(l.usedPercent);if(!Number.isFinite(used))return '';const pct=Math.max(0,Math.min(100,used));return '<div class="big">剩余 '+(100-pct).toFixed(1)+'%</div><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div><div class="muted">'+safe(l.id)+' · 已用 '+pct.toFixed(1)+'% · 重置 '+date(Number(l.resetsAt))+'</div>'}).join(''):'<p class="muted">尚无可验证的官方授权额度数据</p>')+'</section>'}
function render(data){const list=Array.isArray(data?.sources)?data.sources:[];const sources=SOURCES.map(s=>({...s,...(list.find(x=>x&&x.id===s.id)||{state:'not_connected',limits:[]})}));const age=Date.now()-Date.parse(data?.observedAt||'');if(!Number.isFinite(age)||age>15*60*1000){for(const s of sources)if(s.state==='ok')s.state='stale'}document.getElementById('cards').innerHTML=sources.map(card).join('');const active=sources.filter(x=>x.state==='ok').length;document.getElementById('overall').textContent=active?active+' 个数据源已同步':'未连接真实数据源';document.getElementById('overall').className=active?'ok':'warn';document.getElementById('checked').textContent='数据采集时间：'+(data?.observedAt?new Date(data.observedAt).toLocaleString('zh-CN'):'暂无')}
async function refresh(){const b=document.getElementById('refresh');b.disabled=true;try{const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(d.schemaVersion!==1)throw Error('schema');render(d)}catch(e){render({sources:[]});document.getElementById('checked').textContent='数据接口尚未接通（'+safe(e.message)+'）'}finally{b.disabled=false}}
document.getElementById('refresh').addEventListener('click',refresh);refresh();setInterval(refresh,60000);
</script></body></html>
