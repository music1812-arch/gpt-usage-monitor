<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GPT用量管家"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>GPT 用量管家</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1421;color:#eaf0fc;font:16px -apple-system,BlinkMacSystemFont,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}main{max-width:680px;margin:auto}header{padding:26px 0 12px}h1{font-size:26px;margin:0}p,.muted{color:#a7b5ca;font-size:13px;line-height:1.6}.card{background:#182437;border:1px solid #334158;border-radius:18px;padding:17px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.name{font-weight:700;font-size:19px}.num{font-size:23px;font-weight:750;margin:14px 0 4px}.track{height:9px;border-radius:8px;background:#36455a;overflow:hidden;margin:12px 0}.bar{height:100%;background:#68b7ff}button,a.btn{background:#377bea;color:white;border:0;border-radius:10px;padding:11px 14px;font-weight:650;text-decoration:none;display:inline-block;cursor:pointer}button.alt{background:#34445d}input,select{background:#0d1829;border:1px solid #4c5c70;color:#fff;border-radius:10px;padding:12px;width:100%;font-size:16px}label{display:block;margin:12px 0 5px;font-size:13px;color:#c6d5e8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:12px}.hidden{display:none}a{color:#91c9ff}footer{padding:20px 0 35px}</style></head><body><main><header><h1>◈ GPT 用量管家</h1><p>ChatGPT · Work · Codex · API｜个人本地记录</p></header><section id="cards"></section><section class="card"><h2>更新额度记录</h2><p>只录入官方页面显示的真实数字。未知的额度保持空白。</p><label>产品</label><select id="kind"><option>ChatGPT</option><option>Work</option><option>Codex</option><option>API</option></select><div class="grid"><div><label>已使用</label><input id="used" type="number" min="0" step="any" placeholder="未知可留空"></div><div><label>总额度</label><input id="limit" type="number" min="0" step="any" placeholder="未知可留空"></div></div><label>额度单位</label><input id="unit" placeholder="次、任务、美元、tokens 等"><label>重置时间（按手机当地时间）</label><input id="reset" type="datetime-local"><label>备注 / 数据来源</label><input id="note" placeholder="例如：官方页面手动记录"><p><button id="save">保存本地记录</button> <button id="clear" class="alt">清空当前项</button></p></section><section class="card"><h2>官方查看入口</h2><p><a href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT</a> · <a href="https://chatgpt.com/codex" target="_blank" rel="noopener">Codex</a> · <a href="https://platform.openai.com/usage" target="_blank" rel="noopener">API 用量</a></p><p>官方未提供可用的统一账户额度接口时，无法自动获取 ChatGPT、Work、Codex 的实时剩余额度。这里不会估算或伪造数据。</p></section><section class="card"><h2>备份与恢复</h2><p><button id="export">导出 JSON</button> <button id="import" class="alt">导入 JSON</button><input id="file" type="file" accept="application/json,.json" class="hidden"></p><p class="small muted">记录仅存于当前浏览器本地。清理 Safari 网站数据或更换设备可能导致记录丢失，请定期备份。公开网页不包含你的个人记录。</p></section><footer class="muted">V1 · 数据来源：手动记录 · 无账户登录与服务器数据库</footer></main><script>const KEY='gpt-usage-monitor-v1',types=['ChatGPT','Work','Codex','API'];let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem(KEY,JSON.stringify(data))}function render(){let now=Date.now();$('cards').innerHTML=types.map(t=>{let d=data[t]||{},valid=d.used!==''&&d.used!=null&&d.limit!==''&&d.limit!=null&&Number(d.limit)>0,remaining=valid?Math.max(0,Number(d.limit)-Number(d.used)):null,pct=valid?Math.max(0,Math.min(100,remaining/Number(d.limit)*100)):0,dt=d.reset?new Date(d.reset):null,until=dt&&!isNaN(dt)?dt.getTime()-now:null,clock=until===null?'重置时间待记录':until<=0?'记录的重置时间已到，请核对':('距离记录的重置时间：'+Math.floor(until/86400000)+'天 '+Math.floor(until%86400000/3600000)+'小时 '+Math.floor(until%3600000/60000)+'分钟');return '<article class="card"><div class="row"><span class="name">'+t+'</span><span class="small muted">手动记录</span></div><div class="num">'+(valid?safe(remaining)+' / '+safe(d.limit)+' '+safe(d.unit||''):'待同步')+'</div><div class="track"><div class="bar" style="width:'+pct+'%"></div></div><p>'+safe(clock)+'</p><p class="small muted">'+safe(d.note||'尚无记录')+'</p><button class="alt" onclick="edit(\''+t+'\')">编辑</button></article>'}).join('')}function edit(t){$('kind').value=t;load();document.querySelector('section.card').scrollIntoView({behavior:'smooth'})}function load(){let d=data[$('kind').value]||{};['used','limit','unit','reset','note'].forEach(k=>$(k).value=d[k]??'')}$('kind').onchange=load;$('save').onclick=()=>{let d={};['used','limit','unit','reset','note'].forEach(k=>d[k]=$(k).value);if(d.used!==''&&Number(d.used)<0||d.limit!==''&&Number(d.limit)<=0){alert('请输入有效的额度数字');return}data[$('kind').value]=d;persist();render();alert('已保存到本机')};$('clear').onclick=()=>{if(confirm('清空 '+$('kind').value+' 的本地记录？')){delete data[$('kind').value];persist();load();render()}};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,records:data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gpt-usage-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.version!==1||!x.records||typeof x.records!=='object'||Array.isArray(x.records))throw Error('格式错误');if(confirm('导入将覆盖本机当前记录，是否继续？')){data=Object.fromEntries(types.filter(t=>x.records[t]&&typeof x.records[t]==='object').map(t=>[t,x.records[t]]));persist();load();render()}}catch(err){alert('导入失败：'+err.message)}e.target.value=''};load();render();setInterval(render,60000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
